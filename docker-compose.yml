version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recon-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data  # Persist SQLite database
      - ./backend/wordlists:/app/wordlists
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/recon.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recon-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped